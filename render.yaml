# Render Blueprint for the live site (claritymathematics.com).
# One Node service serves both the web pages and /api, with a persistent disk
# for uploaded worksheets and a managed Postgres database.
# Setup steps: docs/hosting.md

services:
  - type: web
    name: clarity
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    # Deploy only after GitHub checks (typecheck + tests) pass on main.
    autoDeployTrigger: checksPass
    # NODE_ENV is set on the start command, not as an env var: pnpm skips
    # devDependencies (vite, esbuild, drizzle-kit) when NODE_ENV=production.
    buildCommand: >-
      npm install -g pnpm@10.28.0 &&
      pnpm install --frozen-lockfile &&
      PORT=3000 BASE_PATH=/ pnpm --filter @workspace/tutor-hub run build &&
      pnpm --filter @workspace/api-server run build
    # Applies schema changes to the database before each new version starts.
    # If drizzle-kit needs a decision (e.g. a column rename or data loss), it
    # fails here and the old version keeps running.
    preDeployCommand: pnpm --filter db run push
    startCommand: NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: clarity-db
          property: connectionString
      - key: STATIC_DIR
        value: artifacts/tutor-hub/dist/public
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CORS_ORIGINS
        value: https://claritymathematics.com,https://www.claritymathematics.com
      # Entered in the Render dashboard on first setup (not stored in git).
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: TUTOR_EMAILS
        sync: false

databases:
  - name: clarity-db
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: "16"
