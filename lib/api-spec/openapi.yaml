openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Math Tutor Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: sessions
    description: Tutoring sessions
  - name: messages
    description: Secure chat messages
  - name: assignments
    description: Homework assignments
  - name: videos
    description: Math tutorial videos
  - name: users
    description: User management
  - name: conversations
    description: Direct and group conversations
  - name: uploads
    description: File uploads
  - name: payments
    description: Session charges and payment tracking
  - name: availability
    description: Tutor availability slots and booking
  - name: parentFeedback
    description: Tutor reports for parents
  - name: parentLinks
    description: Parent-to-student account links
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetCurrentAuthUserResponse"

  /auth/sync-profile:
    post:
      operationId: syncProfile
      tags: [auth]
      summary: Copy the caller's Clerk profile into their user row
      responses:
        "200":
          description: Profile synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncProfileResponse"

  /auth/set-role:
    post:
      operationId: setRole
      tags: [auth]
      summary: Choose a role during onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleBody"
      responses:
        "200":
          description: Role set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetRoleResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all students (tutor only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/tutors:
    get:
      operationId: listTutors
      tags: [users]
      summary: List tutors (for onboarding)
      responses:
        "200":
          description: Tutors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutorSummary"

  /sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List tutoring sessions
      parameters:
        - in: query
          name: studentId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TutoringSession"
    post:
      operationId: createSession
      tags: [sessions]
      summary: Create a tutoring session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionBody"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutoringSession"

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Get a tutoring session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TutoringSession"
    patch:
      operationId: updateSession
      tags: [sessions]
      summary: Update a session (approve/cancel)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionBody"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatedTutoringSession"
    delete:
      operationId: deleteSession
      tags: [sessions]
      summary: Delete a session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages (optionally filter by conversation partner)
      parameters:
        - in: query
          name: withUserId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /assignments:
    get:
      operationId: listAssignments
      tags: [assignments]
      summary: List assignments
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [assignments]
      summary: Create an assignment (tutor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentBody"
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"

  /assignments/{id}:
    patch:
      operationId: updateAssignment
      tags: [assignments]
      summary: Update an assignment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
    delete:
      operationId: deleteAssignment
      tags: [assignments]
      summary: Delete an assignment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /assignments/{id}/submit:
    post:
      operationId: submitAssignment
      tags: [assignments]
      summary: Submit (or resubmit) work for an assignment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssignmentBody"
      responses:
        "200":
          description: Submission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "201":
          description: Submission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /assignments/{id}/my-submission:
    get:
      operationId: getMySubmission
      tags: [assignments]
      summary: Get the submission for an assignment from the person it is assigned to (the caller, or a parent's linked child)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The submission, or null if none
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Submission"
                  - type: "null"

  /assignments/{id}/submissions:
    get:
      operationId: listAssignmentSubmissions
      tags: [assignments]
      summary: List submissions for an assignment (tutor only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssignmentSubmission"

  /submissions/{id}/review:
    post:
      operationId: reviewSubmission
      tags: [assignments]
      summary: Review a submission (tutor only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmissionBody"
      responses:
        "200":
          description: Reviewed submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"

  /videos:
    get:
      operationId: listVideos
      tags: [videos]
      summary: List math tutorial videos
      responses:
        "200":
          description: List of videos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Video"
    post:
      operationId: createVideo
      tags: [videos]
      summary: Share a math video (tutor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoBody"
      responses:
        "201":
          description: Video shared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"

  /videos/{id}:
    delete:
      operationId: deleteVideo
      tags: [videos]
      summary: Delete a video
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List the caller's conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Start a direct or group conversation (direct ones are deduped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationBody"
      responses:
        "200":
          description: Existing direct conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}/messages:
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: List messages in a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendConversationMessage
      tags: [conversations]
      summary: Send a message to a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendConversationMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List files the caller can see
      parameters:
        - in: query
          name: assignmentId
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    post:
      operationId: createUpload
      tags: [uploads]
      summary: Upload a file (max 15 MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateUploadBody"
      responses:
        "201":
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /uploads/{id}:
    delete:
      operationId: deleteUpload
      tags: [uploads]
      summary: Delete a file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /uploads/{id}/download:
    get:
      operationId: downloadUpload
      tags: [uploads]
      summary: Download a file
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List the caller's charges (creates any that are owed)
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/{id}/mark-sent:
    post:
      operationId: markPaymentSent
      tags: [payments]
      summary: Mark a charge as paid (student or parent)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"

  /payments/{id}/mark-received:
    post:
      operationId: markPaymentReceived
      tags: [payments]
      summary: Confirm a payment was received (tutor only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"

  /payments/{id}/mark-refunded:
    post:
      operationId: markPaymentRefunded
      tags: [payments]
      summary: Confirm a refund was sent (tutor only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"

  /payments/settings:
    get:
      operationId: getPaymentSettings
      tags: [payments]
      summary: Get the tutor's hourly rate
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"
    put:
      operationId: updatePaymentSettings
      tags: [payments]
      summary: Set the tutor's hourly rate (tutor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSettings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentSettings"

  /availability:
    get:
      operationId: listAvailability
      tags: [availability]
      summary: List open slots (tutors see their own)
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"
    post:
      operationId: createAvailabilitySlots
      tags: [availability]
      summary: Add open slots (tutor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/CreateAvailabilitySlotBody"
      responses:
        "201":
          description: Slots created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"

  /availability/{id}:
    delete:
      operationId: deleteAvailabilitySlot
      tags: [availability]
      summary: Remove an unbooked slot (tutor only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /availability/{id}/book:
    post:
      operationId: bookAvailabilitySlot
      tags: [availability]
      summary: Book a slot (student or parent)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookAvailabilitySlotBody"
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookAvailabilitySlotResponse"

  /parent-feedback:
    get:
      operationId: listParentFeedback
      tags: [parentFeedback]
      summary: List the tutor's parent reports (tutor only)
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentFeedback"

  /parent-feedback/{studentId}:
    get:
      operationId: listStudentParentFeedback
      tags: [parentFeedback]
      summary: List parent reports for one student, newest first
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentFeedback"
    post:
      operationId: createParentFeedback
      tags: [parentFeedback]
      summary: Add a new dated report for a student (tutor only); earlier reports are kept
      parameters:
        - in: path
          name: studentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveParentFeedbackBody"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentFeedback"

  /parent-feedback/entries/{id}:
    patch:
      operationId: updateParentFeedback
      tags: [parentFeedback]
      summary: Edit one of the tutor's reports (tutor only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveParentFeedbackBody"
      responses:
        "200":
          description: Report updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentFeedback"
    delete:
      operationId: deleteParentFeedback
      tags: [parentFeedback]
      summary: Delete one of the tutor's reports (tutor only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /parent-links:
    get:
      operationId: listParentLinks
      tags: [parentLinks]
      summary: List the parent's linked students (parent only)
      responses:
        "200":
          description: Links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentStudentLink"
    post:
      operationId: createParentLink
      tags: [parentLinks]
      summary: Request a link to a student account by email (parent only; starts pending)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateParentLinkBody"
      responses:
        "200":
          description: Already linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentStudentLink"
        "201":
          description: Linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParentStudentLink"

  /parent-links/{id}:
    delete:
      operationId: deleteParentLink
      tags: [parentLinks]
      summary: Unlink a student (parent only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /parent-links/requests:
    get:
      operationId: listParentLinkRequests
      tags: [parentLinks]
      summary: List pending link requests the caller can approve (the student, or their tutor)
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParentLinkRequest"

  /parent-links/{id}/approve:
    post:
      operationId: approveParentLink
      tags: [parentLinks]
      summary: Approve a parent's link request (the student, or their tutor)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApproveParentLinkResponse"

  /parent-links/{id}/decline:
    post:
      operationId: declineParentLink
      tags: [parentLinks]
      summary: Decline a link request, or revoke an approved link (the student, or their tutor)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GetCurrentAuthUserResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
      required:
        - authenticated

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
          nullable: true
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
        role:
          type: string
          enum: [tutor, student, parent, pending]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role

    TutoringSession:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: string
        studentName:
          type: string
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        topic:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, cancelled, completed]
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - studentId
        - scheduledAt
        - durationMinutes
        - status

    CreateSessionBody:
      type: object
      properties:
        scheduledAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        topic:
          type: string
        notes:
          type: string
      required:
        - scheduledAt
        - durationMinutes

    SessionCancellation:
      type: object
      description: How the refund policy was applied when a session was cancelled
      properties:
        policy:
          type: string
          enum: [full_refund, half_fee, tutor_cancel, no_show]
