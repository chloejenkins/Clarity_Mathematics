kind = "web"
previewPath = "/"
title = "Math Tutor Hub"
version = "1.0.0"
id = "artifacts/tutor-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20106

[services.development]
run = "pnpm --filter @workspace/tutor-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tutor-hub", "run", "build" ]
publicDir = "artifacts/tutor-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20106"
BASE_PATH = "/"
